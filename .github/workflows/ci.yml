name: HFT_RMIC CI

on:
  push:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Check synchronized project records
        run: python -B scripts/sync_project_records.py --check

      - name: Check repository layout
        run: python -B scripts/check_repository_layout.py

      - name: Check Vivado 2022.1 Tcl compatibility
        run: python -B scripts/check_vivado_2022_tcl.py

      - name: Check I5 derived hierarchy contracts
        run: python -B scripts/check_i5_derived_contracts.py

      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD || git diff --check

  integration-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run adapter policy and execution-meta regression
        run: bash scripts/run_adapter_iverilog.sh

      - name: Run futures accounting regression
        run: bash scripts/run_accounting_iverilog.sh

      - name: Run multi-account futures state-manager regression
        run: bash scripts/run_state_manager_iverilog.sh

      - name: Run futures order-context wrapper regression
        run: bash scripts/run_order_context_iverilog.sh

      - name: Run committed execution reconciliation regression
        run: bash scripts/run_execution_bridge_iverilog.sh

      - name: Run I3 atomic CL2EX admission regression
        run: bash scripts/run_cl2ex_admission_iverilog.sh

      - name: Run I3 frozen-HFT order-gate regression
        run: bash scripts/run_order_gate_iverilog.sh

      - name: Run I4 shared CL2EX/EX2CL ownership regression
        run: bash scripts/run_i4_shared_core_iverilog.sh

      - name: Run I4 dual-source risk-to-encoder regression
        run: bash scripts/run_i4_r01_stub_iverilog.sh

      - name: Compile I2 OOC composition harness
        run: bash scripts/run_i2_ooc_compile_iverilog.sh

      - name: Compile I3 atomic CL2EX OOC composition harness
        run: bash scripts/run_i3_cl2ex_ooc_compile_iverilog.sh

      - name: Compile I4 shared risk-to-R01 composition harness
        run: bash scripts/run_i4_r01_ooc_compile_iverilog.sh

      - name: Compile I4 frozen-encoder parity testbench
        run: bash scripts/run_i4_r01_parity_compile_iverilog.sh

      - name: Run I5 keyed execution metadata regression
        run: bash scripts/run_i5_exec_metadata_iverilog.sh

      - name: Run I5 committed execution metadata alignment regression
        run: bash scripts/run_i5_committed_exec_event_iverilog.sh

      - name: Run I5 committed execution FIFO regression
        run: bash scripts/run_i5_exec_commit_fifo_iverilog.sh

      - name: Run I5 speculative order dedupe regression
        run: bash scripts/run_i5_spec_order_dedupe_iverilog.sh

      - name: Run I5 registered risk-ingress regression
        run: bash scripts/run_i5_order_ingress_slice_iverilog.sh

      - name: Run I5 XGMII TX timing-derivative regression
        run: bash scripts/run_i5_xgmii_tx_timing_iverilog.sh

      - name: Run I5 cached hot-map regression
        run: bash scripts/run_i5_cached_exact_map_iverilog.sh
