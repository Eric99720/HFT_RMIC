name: HFT_RMIC CI

on:
  push:
  pull_request:

jobs:
  integration-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Run integration-owned adapter regression
        run: bash scripts/run_adapter_iverilog.sh

      - name: Run futures accounting regression
        run: bash scripts/run_accounting_iverilog.sh
